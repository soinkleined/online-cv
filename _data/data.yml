experiences:
  title: Employment History
  info:
  - role: Senior Manager - Cloud and Infrastructure Services Engineering
    time: Jul 2024 - Present
    company: Anaplan, London, UK
    details: |
      - Directed global Cloud Administration and Infrastructure Services functions, accountable for the strategy, engineering, and operation of Anaplan's multi-cloud (AWS, GCP, Azure) and private cloud platforms supporting a rapidly growing enterprise customer base.
      - Defined and executed Anaplan's cloud regional expansion strategy, delivering six new production regions in 2025 across multiple hyperscalers - the largest single-year expansion in company history - ensuring compliance with global data residency and regulatory requirements while meeting aggressive delivery timelines.
      - Led the transformation of Anaplan's private cloud across four global data centres, modernising legacy infrastructure and consolidating monolithic physical workloads into resilient, scalable virtualised and Kubernetes-based platforms.
      - Built and scaled high-performing global teams through workforce planning, organisational design, and hiring, growing Cloud Administration and Infrastructure Services from small, tactical teams into mature organisations of 5+ engineers each, with sustained hiring pipelines to support future growth.

  - role: Director, Senior Systems Reliability Engineer, Global Banking and Markets Engineering
    time: Feb 2022 - Dec 2023
    company: Scotiabank, London, UK
    details: |
      - Served as a member of the EMEA Management Team, aligning global and regional technology strategy with programme execution to support business growth and operational resilience.
      - Led the Global Markets Site Reliability Engineering (SRE) function, accountable for the reliability, availability, and performance of mission-critical trading and market systems through improved observability, automation, and operational governance.
      - Drove the development of a Python-based telemetry and reporting platform integrating with Splunk, Dynatrace, and ServiceNow, significantly improving real-time visibility, incident response, and operational decision-making.
      - Delivered targeted automation initiatives to optimise grid compute utilisation and memory management, reducing wasted compute cycles and improving infrastructure efficiency.
      - Reduced Global Markets batch processing runtimes by four hours, consistently meeting critical start-of-day SLAs and materially lowering operational risk to the business.
      - Defined and executed a strategic, Python-based migration framework to modernise legacy batch workloads onto Apache Airflow, improving scalability, maintainability, and long-term platform sustainability.

  - role: Vice President - FIC Cloud Transformation Architect
    time: Sept 2021 - Jan 2022
    company: Deutsche Bank, London, UK
    details: |
      - Assessed and validated the suitability of Google Cloud Platform products and services for Fixed Income and Currency applications, producing reference architectures, migration strategies, and standardised templates.
      - Consulted on end-to-end integration of internal systems with cloud services, using cloud adoption to rationalise legacy platforms and improve efficiency, data integrity, and automation.
      - Selected for the DB Cloud Engineering programme to support responsibilities as a Google Cloud Platform architect.
      - Selected for the internal Global Enterprise Engineering programme, recognising technical thought leadership and driving engineering culture change across the organisation.
      - Conceptualised and defined requirements for the [FINOS RSS Spring-Bot](https://github.com/finos/spring-bot/tree/spring-bot-master/tools/rss-bot) initiative ([springbot.finos.org](https://springbot.finos.org/)).
      - Served as a code reviewer for Spring-Bot open-source contributions.

  - role: Vice President - Application Owner, Autobahn Platform Services
    time: Oct 2017 - Aug 2021
    company: Deutsche Bank, London, UK
    details: |
      - Accountable for regulatory and platform compliance for [Autobahn](https://autobahn.db.com), one of the bank's flagship electronic trading platforms, including OS and Java patching, security controls, and adherence to technology roadmap standards.
      - Coordinated delivery and workload across infrastructure, support, and development teams to ensure platform stability and timely execution.
      - Awarded CIB Technology Best Application Owner for proposing and delivering a solution using Active Directory nested groups to centralise and federate role-based access across domains, tools, and services.
      - Supported the release of the bank's first open-source software initiative, [Plexus Interop](https://github.com/finos/plexus-interop), enabling broader industry collaboration.
      - Owned security compliance across the platform, including access controls, segregation of duties, database activity monitoring, vulnerability remediation, and application penetration testing.
      - Designed, delivered, and operated infrastructure architecture to ensure the availability and scalability of Autobahn platform services.
      - Procured and managed delivery of new infrastructure spanning both PaaS and IaaS environments.
      - Led the adoption and migration between Fabric (on-premises OpenShift PaaS), Microsoft Azure, and subsequently Google Cloud Platform, following strategic platform realignment.
      - Documented requirements and partnered with upstream and platform service providers to deliver new platform features and enhanced telemetry supporting the application SRE function.
      - Managed infrastructure migrations between data centres as part of a strategic data-centre exit programme.
      - Led the migration of databases from legacy Solaris-based IaaS platforms to the strategic PaaS Oracle RAC environment.
      - Managed and developed a team of five engineers, with plans to reorganise and rebuild the function in a strategic, lower-cost region; the team owned CI/CD, build and release automation, DevOps, and SRE capabilities.
      - Managed third-party vendor relationships, including global support contracts with DXC and dedicated subject-matter expert support for Autobahn platform services via GFT.

  - role: Vice President - Lead Engineer, Data Security Engineering
    time: Feb 2016 - Sept 2017
    company: Deutsche Bank, London, UK
    details: |
      - Owned the Database Activity Monitoring (DAM) platform based on Imperva SecureSphere, covering agent and server lifecycle management, custom scripting, packaging, deployment, upgrades, and integration with adjacent security and monitoring solutions.
      - Defined the roadmap to integrate SDLC tools and processes into the Infrastructure Engineering release lifecycle, including Git, Jira, Jama, ServiceNow, and proprietary tooling.
      - Managed engineering lab resources and test environments spanning Solaris 10, AIX 6.x, Red Hat Enterprise Linux 6.x/7.x, and Windows Server platforms.
      - Deployed and maintained standardised VMware 5.x images to support development and testing activities.
      - Developed a reusable Perl module to simplify integration with RESTful APIs across internal tools and platforms.
      - Coordinated workloads and deliverables for external staff and contractors.
      - Managed vendor and client relationships to ensure delivery alignment and service quality.

  - role: UNIX Technical Lead - Technical Access Management Program (Contract)
    time: Mar 2015 - Sept 2015
    company: Deutsche Bank, London, UK
    details: |
      - Served as UNIX subject matter expert for the strategic target operating model for brokered privileged access based on CyberArk PSM.
      - Defined configuration standards for brokered access, remediated non-compliant configurations, and provided requirements for a proprietary brokered access request and management portal.
      - Developed a sudoers file parser to report sudo-based elevated privileges across the global server estate.
      - Defined and implemented SSH key policies for public and private keys, establishing standardised key formats to ensure traceability, ownership, and integrity across global production environments.
      - Remediated non-compliant and erroneous SSH keys across the global production estate, reducing security risk and audit findings.

  - role: UNIX Consultant - Administrative Minimal Rights Program (Contract)
    time: Oct 2012 - Mar 2015
    company: Deutsche Bank, London, UK
    details: |
      - Served as EMEA lead for UNIX deployments, coordinating international stakeholders and regional resourcing, and communicating effectively in both German and English.
      - Led the testing and global deployment of privileged access and audit tooling, including CyberArk, BeyondTrust PowerBroker, and proprietary solutions, to meet regulatory and audit requirements across North American, European, and Asia-Pacific environments.
      - Supported environments comprising 10,000+ UNIX and Linux systems, spanning Solaris 8/9/10, AIX 5.3/6.1, Oracle Enterprise Linux 6, Red Hat Enterprise Linux 5/6, and SUSE Linux Enterprise Server 10/11.
      - Delivered training to regional support teams on new tools and operational processes, providing transition support through the promotion-to-production phase.
      - Authored implementation procedures and operational runbooks for Global UNIX Projects and Support teams.

  - role: UK External Operations - Senior Unix Administrator
    time: Jan 2012 - Oct 2012
    company: Intralinks, London, UK
    details: |
      - Accountable for the procurement, provisioning, and support of server infrastructure comprising 300+ Solaris 10 and Red Hat Enterprise Linux 5/6 systems across data centres in the US and UK.
      - Established UK-based vendor relationships in partnership with Finance and Legal to enable local procurement and support, supporting the company's international expansion.
      - Managed and rationalised vendor support relationships, consolidating 76 individual support contracts into four strategic agreements aligned by technology domain and geography.
      - Reviewed and developed IT services, policies, and operational tooling to establish and enforce infrastructure standards across the organisation.
      - Deployed and configured Puppet Master as part of an early infrastructure DevOps strategy, improving configuration consistency and operational efficiency.

  - role: Unix Infrastructure Team Lead
    time: 2010 - 2012
    company: Sainsbury's Supermarkets, London, UK
    details: |
      - Managed a team of nine direct reports delivering the implementation and deployment of Solaris 10 and Oracle Enterprise Linux 5 across Oracle/Sun V, X, T, and M-series servers.
      - Provided senior on-call escalation support for an estate of approximately 1,000 servers.
      - Led infrastructure projects spanning the full breadth of the business, including logistics, forecasting, order fulfilment, and e-commerce platforms.
      - Developed individual development plans and conducted performance reviews for Infrastructure team members.
      - Conducted interviews and candidate evaluations for UNIX, Database, and Windows engineering teams.
      - Led the migration of server platforms from Solaris and Oracle Linux to Red Hat Enterprise Linux.
      - Defined and delivered the virtualisation strategy for both data-centre and store-based infrastructure.
      - Managed and advised on the strategic hardware vendor transition from Sun/Oracle to IBM for server procurement and support.
      - Reviewed, developed, and maintained IT services, policies, and operational tooling.
      - Managed vendor relationships and support contracts to ensure service continuity and value.

