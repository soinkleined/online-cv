career-profile:
  title: Profile
  summary: |
    Technology leader with 25+ years of experience directing global infrastructure and platform services across enterprise environments in the US, Germany, and the UK. Proven track record of leading large-scale transformation across Internet, Automotive, Financial Services, Retail, and SaaS sectors, driving modernisation, consolidation, operational resilience, and customer-focused outcomes. Brings a global perspective and strong executive presence, with a reputation for building high-performing teams, leading through change, and aligning technology strategy with business objectives.

